<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>د. هارون داود</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap">
<style>
:root{--bg:#000;--fg:#fff;--muted:#8b8b8b;--card:#0b0b0b;--line:#2a2a2a;--wa:#25d366;--logo-filter:none;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fff;--fg:#111;--muted:#666;--card:#f6f6f6;--line:#ddd;--logo-filter:invert(1);color-scheme:light}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--muted:#8b8b8b;--card:#0b0b0b;--line:#2a2a2a;--logo-filter:none}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:'Tajawal',system-ui,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line);max-width:480px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;letter-spacing:.5px}
.brand img{height:34px;width:auto;filter:var(--logo-filter)}
.icons{display:flex;gap:18px;direction:ltr}
.icons a{color:var(--fg);display:block;width:28px;height:28px}
.icons a:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}
.icons svg{width:100%;height:100%}
main{max-width:480px;margin:0 auto;padding:64px 24px 48px;display:flex;flex-direction:column;align-items:center;gap:64px}
.circle{width:min(46vw,190px);aspect-ratio:1;border-radius:50%;background:#fff;border:4px solid #1e1e1e;box-shadow:0 0 60px rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;overflow:hidden}
.circle img{width:80%;height:auto;filter:invert(1)}
.links{width:100%;display:flex;flex-direction:column;gap:14px}
a.btn{display:flex;align-items:center;gap:16px;padding:13px 18px;background:var(--card);border:1px solid var(--line);border-radius:20px;color:var(--fg);text-decoration:none;font-size:16px;font-weight:700;transition:border-color .2s,transform .2s}
a.btn:hover{border-color:var(--fg)}
a.btn:active{transform:scale(.98)}
a.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
a.btn svg{width:26px;height:26px;flex:none}
a.btn span{flex:1}
a.btn .arr{width:18px;height:18px;color:var(--muted)}
.ig{color:#e1306c}.wa{color:var(--wa)}
</style>
</head>
